; Per-directory PHP overrides for HTTP requests (see PHP user_ini.filename).
; After changing, restart Herd (menu bar → Restart) or your PHP-FPM stack.
; If you still see 413, increase nginx client_max_body_size for the site (Herd: site nginx snippet or global herd.conf).
; artisan serve ignores this file; bootstrap/php-runtime.php covers CLI.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
upload_max_filesize = 128M
post_max_size = 128M

name: BOA PDF CI/CD

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: boa-pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: shivammathur/setup-php@2.35.3
        with:
          php-version: "8.3"
          coverage: none
          tools: composer:v2

      - name: Install PDF conversion tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            fonts-dejavu-core fonts-liberation ghostscript libreoffice-writer \
            ocrmypdf poppler-utils python3-venv qpdf tesseract-ocr
          python3 -m venv .venv
          .venv/bin/pip install --requirement requirements-conversion.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Copy env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify PHP platform
        run: composer check-platform-reqs

      - name: Composer audit
        run: composer audit --locked || true

      - name: Generate key
        run: php artisan key:generate

      - name: Pint
        run: vendor/bin/pint --test

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: npm audit
        run: npm audit --omit=dev || true

      - name: Run tests
        run: php artisan test --compact

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: boa-pdf:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy staging
    needs: [quality, docker]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd /var/www/boapdf-staging
            git fetch origin dev
            git checkout dev
            git pull origin dev
            docker compose build
            docker compose up -d
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize
            HTTP_PORT=$(grep -E '^HTTP_PORT=' .env 2>/dev/null | cut -d= -f2- || true)
            curl -fsS "http://127.0.0.1:${HTTP_PORT:-8081}/up"

  deploy-production:
    name: Deploy production
    needs: [quality, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy production over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail
            cd /var/www/boapdf-production
            git fetch origin main
            git checkout main
            git pull origin main
            docker compose build
            docker compose up -d
            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize
            HTTP_PORT=$(grep -E '^HTTP_PORT=' .env 2>/dev/null | cut -d= -f2- || true)
            curl -fsS "http://127.0.0.1:${HTTP_PORT:-8080}/up"
